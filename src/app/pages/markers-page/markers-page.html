@if (apiLoaded()) {
<div class="w-screen h-[60vh] sm:h-[calc(100vh-64px)]">
  <app-map-view [center]="{lat: 0, lng: 0}" [zoom]="14" (mapClick)="onMapClick($event)">
  </app-map-view>

  <section class="h-[calc(40vh-64px)] p-2 w-full
    sm:fixed sm:w-96 sm:rounded-2xl sm:bottom-10 left-3 sm:border-2 sm:shadow-lg
    backdrop-blur-sm text-black dark:text-white bg-white/20 dark:bg-slate-800">
    @if(markers().length === 0){
    <h2 class="text-center text-xl font-semibold border-b border-gray-200 pb-2">No markers yet</h2>
    <p class="text-center pt-4">Click on any place to add a marker</p>
    } @else {
    <h2 class="text-center text-xl font-semibold border-b border-gray-200 pb-2">Markers</h2>

    <div class="flex flex-col pt-2 h-[85%] overflow-y-scroll">
      @for(marker of markers(); track $index){
      <div class="form-control" (click)="flyToMarker(marker.position)" (dblclick)="deleteMarker(marker.id)">
        <label class="label cursor-pointer flex flex-row justify-between p-1">
          <span class="label-text text-black w-72 truncate">{{ {lat: marker.position.lat | number:'1.3-3', lng:
            marker.position.lng | number:'1.3-3'} | json }}</span>
          <input type="radio" name="radio"
            class="radio checked:bg-cyan-700 dark:checked:bg-blue-900 checkbox-primary" />
        </label>
      </div>
      }
    </div>
    }
  </section>
</div>
} @else {
<span class="loading loading-ring loading-xl"></span>
}
