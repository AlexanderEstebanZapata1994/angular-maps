@if (apiLoaded()) {
<div class="w-screen h-[calc(100vh-64px)]">
  <app-map-view [center]="{lat: 4.5200, lng: -75.7103}" [zoom]="14" (mapClick)="onMapClick($event)">
  </app-map-view>
</div>
} @else {
<span class="loading loading-ring loading-xl"></span>
}


<section
  class="fixed w-96 rounded-2xl text-black dark:text-white bg-white/20 backdrop-blur-sm dark:bg-slate-800 bottom-10 left-3 shadow-lg p-5 border-2">
  @if(markers().length === 0){
  <h2 class="text-center text-xl font-semibold">No markers yet</h2>
  <p class="text-center">Click on any place to add a marker</p>
  } @else {
  <h2 class="text-center text-xl font-semibold border-b pb-2">Markers added</h2>

  <div class="flex flex-col pt-4 max-h-75 overflow-y-auto">
    @for(marker of markers(); track $index){
    <div class="form-control">
      <label class="label cursor-pointer flex flex-row justify-between p-1">
        <span class="label-text text-black w-72 truncate">{{ {lat: marker.position.lat | number:'1.3-3', lng:
          marker.position.lng | number:'1.3-3'} | json }}</span>
        <input type="radio" name="radio" class="radio checked:bg-cyan-700 dark:checked:bg-blue-900 checkbox-primary"
          (click)="flyToMarker(marker.position)" />
      </label>
    </div>
    }
  </div>
  }
</section>
